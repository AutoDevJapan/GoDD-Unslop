[package]
name = "godd-unslop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "Japanese writing feedback from practical revision experience"
repository = "https://github.com/AutoDevJapan/GoDD-Unslop"
publish = false

[features]
default = ["mcp"]
mcp = ["dep:rmcp", "dep:tokio"]

[dependencies]
pulldown-cmark = "0.13"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "3.1.4", features = ["transport-io"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"], optional = true }
rusqlite = { version = "0.39", features = ["bundled"] }

[[bin]]
name = "godd-unslop"
path = "src/main.rs"
required-features = ["mcp"]

[workspace]
